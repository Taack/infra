plugins {
    id 'taack-grails-webapp'
    id 'taack-grails-security'
}

group = "taack.ui.test"

grails {
    // should use gradle -Dgrails.run.active=true bootRun
    exploded = true
    plugins {
        implementation project(':taack-ui')
        implementation project(':taack-ui-pdf')
        implementation project(':taack-ui-sec')
        implementation project(':taack-ui-asciidoc')
        implementation project(':taack-ui-jdbc')
        implementation project(':taack-ui-search')
        implementation project(':taack-ui-ssh')
    }
}

bootJar {
    enabled = true
    requiresUnpack '**/asciidoctorj*.jar'
}

bootRun {
    jvmArgs(
            '-Dspring.output.ansi.enabled=always',
            '-Xmx1024m'
    )
}

assets {
    minifyJs = true
    minifyCss = true
}

groovydoc {
    enabled = false
}
