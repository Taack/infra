plugins {
    id 'taack-grails-common'
    id 'org.apache.grails.gradle.grails-app'
    id 'war'
    id 'cloud.wondrify.asset-pipeline'
    // https://docs.spring.io/spring-boot/gradle-plugin/aot.html
    // https://grails.apache.org/docs/latest/guide/deployment.html#deploymentAot
    id 'org.graalvm.buildtools.native' version '1.1.12'
}

apply plugin: 'org.springframework.boot.aot'

group = "taack.ui.test.minimal"
version = "0.7.0"

dependencies {
    profile "org.apache.grails.profiles:web"
    runtimeOnly "com.h2database:h2"
    runtimeOnly "com.zaxxer:HikariCP"
    runtimeOnly "cloud.wondrify:asset-pipeline-grails"
}

tasks.named('processAot') {
    println "AUOAOUAUOUAOUOAUOAUOAUOAUOAUOAUUOAUOAOUAU"
    systemProperty 'grails.env', 'production'
}

//processAot {
//    println "AUO1111AOUAUOUAOUOAUOAUOAUOAUOAUOAUUOAUOAOUAU"
//    systemProperty 'grails.env', 'production'
//}

grails {
    // should use gradle -Dgrails.run.active=true bootRun
    exploded = false
    plugins {
        implementation project(':taack-ui')
        implementation project(':taack-ui-ext')
    }
    // set -gx JAVA_HOME ~/dev/graalvm/graalvm-25.3.4.1+1.1/
    // set -gx GRAALVM_HOME ~/dev/graalvm/graalvm-25.3.4.1+1.1/
    // ../gradlew traceNativeMetadata
    nativeMetadata {
        paths = ['/', '/stats/topCustomerSalesCard', '/calendar/fromCustom', '/calendar/fromUiTable']
//        forms = ['/stats/editTestInlineEdit']
    }
}

bootJar {
    enabled = true
    requiresUnpack '**/asciidoctorj*.jar'
}

//bootRun {
//    ignoreExitValue true
//    jvmArgs(
//            '-Dspring.output.ansi.enabled=always',
////            '-noverify',
